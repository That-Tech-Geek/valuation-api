name: Eligible PR auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: eligible-pr-\${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate-and-merge:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Check maintainer approval
        id: approval
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: \${{ github.event.pull_request.number }}
          REPOSITORY: \${{ github.repository }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" --paginate --jq '[.[] | select(.user.login == "That-Tech-Geek")][-1].state // "NONE"')"
          echo "Latest maintainer review: $state"
          if [ "$state" != "APPROVED" ]; then
            echo "PR held: waiting for an approval from @That-Tech-Geek."
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "approved=true" >> "$GITHUB_OUTPUT"

      - name: Enforce scope and meaningful versioned change
        id: eligibility
        if: steps.approval.outputs.approved == 'true'
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: \${{ github.repository }}
          PR_NUMBER: \${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! python scripts/release_eligibility.py "$PR_NUMBER"; then
            echo "PR held. It is out of scope, non-significant, or missing a coordinated version bump."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Wait for all PR checks
        if: steps.approval.outputs.approved == 'true' && steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: \${{ github.event.pull_request.number }}
        run: gh pr checks "$PR_NUMBER" --watch --fail-fast

      - name: Enable squash auto-merge
        if: steps.approval.outputs.approved == 'true' && steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: \${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
