name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-benchmarks:
    name: Quality, scope and performance gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          components: clippy

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test and fixture dependencies
        run: python -m pip install --upgrade pip pyarrow maturin pytest

      - name: Compile-check repository scripts
        run: python -m compileall -q scripts

      - name: Verify PR scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_scope.py "$BASE_SHA" "$HEAD_SHA"

      - name: Generate deterministic Rust test fixture
        run: python scripts/create_fixture.py

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --all-targets

      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release

      - name: Enforce binary size budget
        run: |
          size="$(stat -c%s target/release/valuation-api)"
          echo "Release binary: $size bytes"
          test "$size" -lt 15728640

      - name: Build and test Python wheel
        run: |
          maturin build --release --out dist
          python -m pip install --force-reinstall dist/*.whl
          python -m pytest -q

      - name: Generate 1,000-company benchmark snapshot
        run: python scripts/create_fixture.py --rows 1000 --out data/benchmark/fundamentals.parquet

      - name: Run live API latency and RAM benchmark
        run: |
          set -o pipefail
          python scripts/benchmark_api.py \
            --binary target/release/valuation-api \
            --data data/benchmark/fundamentals.parquet \
            --rows 1000 \
            --single-iterations 100 \
            --batch-iterations 30 \
            --max-startup-ms 2000 \
            --max-single-p95-ms 5 \
            --max-batch-p95-ms 200 \
            --max-rss-mib 250 | tee benchmark-results.json

      - name: Publish benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valuation-benchmark-${{ github.sha }}
          path: benchmark-results.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Add benchmark summary
        if: always()
        run: |
          if [ -f benchmark-results.json ]; then
            echo '### 1,000-company benchmark' >> "$GITHUB_STEP_SUMMARY"
            echo 'JSON results attached as workflow artifact.' >> "$GITHUB_STEP_SUMMARY"
            cat benchmark-results.json >> "$GITHUB_STEP_SUMMARY"
          fi
