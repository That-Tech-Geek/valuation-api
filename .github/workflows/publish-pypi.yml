name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build and publish (for example v0.1.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require release commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          TAG_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$TAG_COMMIT" FETCH_HEAD || {
            echo "Refusing to publish: tagged commit is not reachable from main."
            exit 1
          }
      - name: Check tag, package name and versions
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          TAG_VERSION="$TAG_VERSION" python - <<'PY'
          import os
          import pathlib
          import tomllib

          expected = os.environ["TAG_VERSION"]
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          if pyproject["project"]["name"] != "valuation":
              raise SystemExit(
                  f'Expected PyPI distribution name "valuation", got {pyproject["project"]["name"]!r}'
              )
          versions = {
              "pyproject.toml": pyproject["project"]["version"],
              "Cargo.toml": cargo["package"]["version"],
          }
          mismatches = {name: value for name, value in versions.items() if value != expected}
          if mismatches:
              raise SystemExit(f"Tag v{expected} does not match package versions: {mismatches}")
          print(f"Release validated: valuation {expected}")
          PY
      - name: Rust tests
        run: cargo test --all-targets
      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Python packaging tests
        run: |
          python -m pip install --upgrade pip maturin pytest
          maturin build --release --out dist
          python -m pip install dist/*.whl
          python -m pytest -q

  build-wheels:
    name: Build ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install --upgrade pip maturin
      - name: Build wheel
        run: maturin build --release --out dist --interpreter python
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-sdist:
    name: Build source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install --upgrade pip maturin
      - name: Build source distribution
        run: maturin sdist --out dist
      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: source-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distribution to PyPI
    needs: [validate, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/valuation
    steps:
      - name: Download all wheel and source artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
