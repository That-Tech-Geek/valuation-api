name: Release after approved merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  actions: write
  checks: read
  statuses: read
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout merged main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify meaningful change and release version
        id: eligibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          result="$(python scripts/release_eligibility.py "$PR_NUMBER" --merged)"
          echo "$result"
          release="$(python -c 'import json,sys; print(str(json.loads(sys.argv[1]).get("release", False)).lower())' "$result")"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$release" != "true" ]; then
            echo "Non-release change: merge is complete; PyPI publication is skipped."
            exit 0
          fi
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for main-branch CI benchmark gate
        if: steps.eligibility.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            result="$(gh api "repos/$REPOSITORY/commits/$COMMIT_SHA/check-runs" --jq '[.check_runs[] | select(.name == "Quality, scope and performance gates")] | sort_by(.started_at) | last | if . == null then "missing" elif .status != "completed" then "pending" else .conclusion end')"
            echo "Main CI benchmark gate: $result"
            if [ "$result" = "success" ]; then exit 0; fi
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ] || [ "$result" = "timed_out" ]; then
              echo "Main CI failed; withholding PyPI publication."
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for main CI. No PyPI release created."
          exit 1

      - name: Wait for successful Vercel production deployment
        if: steps.eligibility.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            state="$(gh api "repos/$REPOSITORY/commits/$COMMIT_SHA/status" --jq '[.statuses[] | select(.context == "Vercel")] | sort_by(.created_at) | last | .state // "missing"')"
            echo "Vercel production status: $state"
            if [ "$state" = "success" ]; then exit 0; fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "Vercel deployment failed; withholding PyPI publication."
              exit 1
            fi
            sleep 10
          done
          echo "No successful Vercel status appeared within 10 minutes. No PyPI release created."
          exit 1

      - name: Create immutable version tag
        if: steps.eligibility.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ steps.eligibility.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if existing="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null)"; then
            if [ "$existing" != "$COMMIT_SHA" ]; then
              echo "Tag $TAG already points to a different commit ($existing)."
              exit 1
            fi
          else
            gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$COMMIT_SHA"
          fi
          echo "Created/verified $TAG at $COMMIT_SHA"

      - name: Dispatch tag-validated PyPI publication
        if: steps.eligibility.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.eligibility.outputs.version }}
        run: gh workflow run publish-pypi.yml --ref main -f "release_tag=$TAG"
