services:
  valuation-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATA_PATH: /data/fundamentals.parquet
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN:-}
    volumes:
      - ./data:/data:ro
    restart: unless-stopped
